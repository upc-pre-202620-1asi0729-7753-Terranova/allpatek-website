<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{coming.meta}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="coming-page">
    <main class="coming" role="main" aria-labelledby="coming-title">
      <a class="logo coming__logo" href="index.html" aria-label="{nav.home}">
        <img class="logo__img" src="assets/logo.png" width="72" height="40" alt="" />
        <span class="logo__text" aria-hidden="true"><span>ALLPA</span><span>TEK</span></span>
      </a>

      <div class="lang coming__lang" role="group" aria-label="{lang.aria}">
        <button type="button" class="lang__btn is-active" data-lang="en_US" aria-pressed="true">EN</button>
        <button type="button" class="lang__btn" data-lang="es_419" aria-pressed="false">ES</button>
      </div>

      <h1 id="coming-title">{coming.title}</h1>

      <a class="btn btn--gold btn--lg" href="index.html">{coming.back}</a>
    </main>
    <script src="script.js"></script>
  </body>
</html>
